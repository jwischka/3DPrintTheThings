name: Android UI and simulator instrumentation

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/native/**'
      - 'tools/parity/**'
      - '.github/workflows/native-*.yml'
      - '.github/workflows/parity*.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Create ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build the original application and test APKs
        run: >-
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --no-build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Prepare disposable emulator APK
        run: |
          mkdir -p "$RUNNER_TEMP/browser-ui"
          python3 tools/prepare-ui-test-apk.py \
            --input app/build/outputs/apk/debug/app-debug.apk \
            --output "$RUNNER_TEMP/browser-ui/app-ui-only.apk" \
            --keystore "$HOME/.android/debug.keystore" \
            --zipalign "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          python3 tools/prepare-ui-test-apk.py \
            --input app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --output "$RUNNER_TEMP/browser-ui/androidTest-ui-only.apk" \
            --keystore "$HOME/.android/debug.keystore" \
            --zipalign "$ANDROID_HOME/build-tools/34.0.0/zipalign" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          app_info=$("$signer" verify --print-certs "$RUNNER_TEMP/browser-ui/app-ui-only.apk")
          test_info=$("$signer" verify --print-certs "$RUNNER_TEMP/browser-ui/androidTest-ui-only.apk")
          printf 'Disposable app certificate:\n%s\nDisposable test certificate:\n%s\n' "$app_info" "$test_info"
          app_cert=$(printf '%s\n' "$app_info" | grep 'Signer #1 certificate SHA-256 digest:' || true)
          test_cert=$(printf '%s\n' "$test_info" | grep 'Signer #1 certificate SHA-256 digest:' || true)
          test -n "$app_cert" && test "$app_cert" = "$test_cert"
      - name: Enable KVM on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test and start the isolated U1 simulator
        run: |
          python3 -m unittest discover -s tools/simulator -v
          python3 tools/simulator/u1_simulator.py --host 0.0.0.0 --allow-remote > "$RUNNER_TEMP/u1-simulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/u1-simulator.pid"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18725/__sim/info; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/u1-simulator.log"
          exit 1
      - name: Run isolated UI and simulated-printer instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            python3 tools/run-browser-instrumentation.py
            --app "$RUNNER_TEMP/browser-ui/app-ui-only.apk"
            --test "$RUNNER_TEMP/browser-ui/androidTest-ui-only.apk"
            --log browser-ui-results/instrumentation.log --timeout 300
      - name: Stop simulator and retain diagnostics
        if: always()
        run: |
          mkdir -p browser-ui-results
          if [ -f "$RUNNER_TEMP/u1-simulator.log" ]; then cp "$RUNNER_TEMP/u1-simulator.log" browser-ui-results/; fi
          if [ -f "$RUNNER_TEMP/u1-simulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/u1-simulator.pid")" || true; fi
      - name: Upload browser UI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-logs-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            browser-ui-results/
            app/build/reports/androidTests/
