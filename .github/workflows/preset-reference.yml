name: Same-source Linux preset reference

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/preset-reference.yml'
      - 'scripts/native/build-host-reference.sh'
      - 'tools/parity/host/**'
      - 'tools/parity/prepare_presets.py'
      - 'tools/parity/capture_reference.py'
      - 'tools/parity/provenance.py'
      - 'app/src/main/cpp/src/sapil_presets.*'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_MAXSIZE: 2G
      NATIVE_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build ccache git pkg-config \
            libboost-all-dev libtbb-dev libcgal-dev libeigen3-dev libgmp-dev libmpfr-dev \
            libocct-data-exchange-dev libocct-visualization-dev libocct-ocaf-dev \
            libcereal-dev libnlopt-cxx-dev libopencv-dev libssl-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig-dev libpng-dev libjpeg-dev libexpat1-dev zlib1g-dev \
            libglew-dev libglfw3-dev libdbus-1-dev libpango1.0-dev \
            libopenvdb-dev libblosc-dev libopenexr-dev
      - id: pin
        run: echo "sha=$(git ls-tree HEAD app/src/main/cpp/orcaslicer | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/host-reference-ccache
          key: host-reference-gcc13-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
          restore-keys: host-reference-gcc13-${{ steps.pin.outputs.sha }}-
      - name: Build independent upstream Linux reference
        env:
          HOST_REFERENCE_DIR: ${{ runner.temp }}/host-reference
          CCACHE_DIR: ${{ runner.temp }}/host-reference-ccache
        run: |
          set -o pipefail
          mkdir -p host-reference-report
          bash scripts/native/build-host-reference.sh 2>&1 | tee host-reference-report/build.log
      - name: Capture unchanged U1 and explicitly sanitized diagnostic presets
        env:
          HOST_REFERENCE_DIR: ${{ runner.temp }}/host-reference
        run: |
          python3 tools/parity/prepare_presets.py --source "$HOST_REFERENCE_DIR/source" --output "$RUNNER_TEMP/full-presets"
          python3 tools/parity/capture_reference.py \
            --executable "$HOST_REFERENCE_DIR/output/preset-reference" \
            --bundle "$RUNNER_TEMP/full-presets" --input tools/parity/fixtures/cube_10mm.stl \
            --resources "$HOST_REFERENCE_DIR/source/resources" \
            --engine-pin "$(cat "$HOST_REFERENCE_DIR/output/engine-source.txt")" \
            --output "$HOST_REFERENCE_DIR/output/captures"
      - uses: actions/cache/save@v4
        if: always() && steps.pin.outcome == 'success'
        with:
          path: ${{ runner.temp }}/host-reference-ccache
          key: host-reference-gcc13-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-source-linux-preset-reference
          path: |
            host-reference-report/
            ${{ runner.temp }}/host-reference/output/
          if-no-files-found: error
