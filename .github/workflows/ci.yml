name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Fetch the pinned native source used by the JVM shim test
        run: |
          engine_commit=$(git ls-tree HEAD app/src/main/cpp/orcaslicer | awk '{print $3}')
          test "${#engine_commit}" -eq 40
          mkdir -p app/src/main/cpp/orcaslicer/src/libslic3r
          curl --fail --location --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/taylormadearmy/OrcaSlicer/${engine_commit}/src/libslic3r/PrintObject.cpp" \
            --output app/src/main/cpp/orcaslicer/src/libslic3r/PrintObject.cpp
      - run: >-
          ./gradlew assembleDebug assembleRelease testDebugUnitTest --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apks-and-test-reports
          path: |
            app/build/outputs/apk/
            app/build/reports/tests/
            app/build/test-results/
