name: Experimental native engine build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-engine.yml'
      - 'scripts/native/build-engine.sh'
      - 'scripts/native/prepare-emulator-apk.py'
      - 'scripts/native/verify_engine_binary.py'
      - 'scripts/native/run-native-instrumentation.py'
      - 'scripts/native/export-parity-capture.py'
      - 'scripts/native/export-full-preset-capture.py'
      - 'tools/parity/prepare_presets.py'
      - 'tools/parity/provenance.py'
      - 'scripts/native/tests/**'
      - 'app/src/androidTest/java/com/u1/slicer/slicing/AndroidParityCaptureTest.kt'
      - 'app/src/androidTest/java/com/u1/slicer/slicing/NativeContractInstrumentedTest.kt'
      - 'app/src/androidTest/java/com/u1/slicer/slicing/NativePresetInstrumentedTest.kt'
      - 'app/src/androidTest/java/com/u1/slicer/printer/DownloadSliceUploadInstrumentedTest.kt'
      - 'app/src/androidTest/java/com/u1/slicer/MainActivityWorkflowInstrumentedTest.kt'
      - 'tools/run-browser-instrumentation.py'
      - 'tools/simulator/**'
      - 'tools/parity/fixtures/cube_10mm.stl'
      - 'scripts/native/sources.lock'
      - 'scripts/native/build-deps.sh'
      - 'scripts/native/extra-sources.lock'
      - 'scripts/native/build-extra-deps.sh'
      - 'app/src/main/cpp/**'
      - 'app/src/main/java/com/u1/slicer/viewer/**'
      - 'app/src/main/java/com/u1/slicer/presets/**'
      - 'app/src/main/java/com/u1/slicer/ui/FullPresetScreen.kt'
      - 'app/src/main/java/com/u1/slicer/FullPresetActivity.kt'
      - 'app/src/experimental/**'
      - 'app/src/androidTestExperimental/**'
      - 'app/build.gradle'
      - 'tools/parity/package_presets.py'

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;26.1.10909125'
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/native-deps/prefix/${{ matrix.abi }}
          key: native-deps-ndk26-${{ matrix.abi }}-all-${{ hashFiles('scripts/native/sources.lock', 'scripts/native/build-deps.sh') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/native-deps/extra/${{ matrix.abi }}
          key: native-extra-ndk26-${{ matrix.abi }}-all-${{ hashFiles('scripts/native/extra-sources.lock', 'scripts/native/build-extra-deps.sh', 'scripts/native/sources.lock', 'scripts/native/build-deps.sh') }}
          fail-on-cache-miss: true
      - name: Install compiler cache and record engine pin
        id: pin
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          echo "sha=$(git ls-tree HEAD app/src/main/cpp/orcaslicer | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/native-ccache-$ANDROID_ABI"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/native-ccache-${{ matrix.abi }}
          key: native-ccache-ndk26-${{ matrix.abi }}-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
          restore-keys: native-ccache-ndk26-${{ matrix.abi }}-${{ steps.pin.outputs.sha }}-
      - name: Fetch pinned engine and prepare sources
        env:
          NATIVE_ENGINE_DIR: ${{ runner.temp }}/native-engine
          NATIVE_DEPS_PREFIX: ${{ runner.temp }}/native-deps/prefix/${{ matrix.abi }}
          NATIVE_EXTRA_DEPS_PREFIX: ${{ runner.temp }}/native-deps/extra/${{ matrix.abi }}
          NATIVE_ENGINE_PREPARE_ONLY: '1'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          bash scripts/native/build-engine.sh
      - name: Build and check experimental engine
        env:
          NATIVE_ENGINE_DIR: ${{ runner.temp }}/native-engine
          NATIVE_DEPS_PREFIX: ${{ runner.temp }}/native-deps/prefix/${{ matrix.abi }}
          NATIVE_EXTRA_DEPS_PREFIX: ${{ runner.temp }}/native-deps/extra/${{ matrix.abi }}
          NATIVE_ENGINE_PREPARED: '1'
          CCACHE_DIR: ${{ runner.temp }}/native-ccache-${{ matrix.abi }}
          CCACHE_MAXSIZE: 2G
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          mkdir -p native-engine-report
          bash scripts/native/build-engine.sh 2>&1 | tee native-engine-report/build.log
      - uses: actions/cache/save@v4
        if: always() && steps.pin.outcome == 'success'
        with:
          path: ${{ runner.temp }}/native-ccache-${{ matrix.abi }}
          key: native-ccache-ndk26-${{ matrix.abi }}-${{ steps.pin.outputs.sha }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-engine-report-${{ matrix.abi }}
          path: native-engine-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: experimental-native-engine-${{ matrix.abi }}
          path: ${{ runner.temp }}/native-engine/output/

  slice-smoke:
    needs: engine
    # A failed ABI build must not suppress testing a successfully built ABI.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-native-engine-${{ matrix.abi }}
          path: ${{ runner.temp }}/native-engine-tested
      - name: Create ephemeral debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Prepare exact parity fixture
        run: |
          mkdir -p app/src/androidTest/assets
          cp tools/parity/fixtures/cube_10mm.stl app/src/androidTest/assets/cube_10mm.stl
          python3 -m unittest discover -s scripts/native/tests -v
      - name: Prepare complete presets from the engine source pin
        run: |
          set -euo pipefail
          pin=$(git ls-tree HEAD app/src/main/cpp/orcaslicer | awk '{print $3}')
          source="$RUNNER_TEMP/preset-source"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/taylormadearmy/OrcaSlicer.git
          git -C "$source" sparse-checkout init --cone
          git -C "$source" sparse-checkout set resources/profiles/Snapmaker
          git -C "$source" fetch --depth=1 --filter=blob:none origin "$pin"
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$pin"
          python3 tools/parity/prepare_presets.py --source "$source" --output app/src/androidTest/assets/full-presets
          printf '%s\n' "$pin" > app/src/androidTest/assets/full-presets/engine-source.txt
          python3 tools/parity/package_presets.py --bundle app/src/androidTest/assets/full-presets --manifest actual.json --output app/src/androidTest/assets/full-presets-actual.zip
          python3 tools/parity/package_presets.py --bundle app/src/androidTest/assets/full-presets --manifest diagnostic.json --output app/src/androidTest/assets/full-presets-diagnostic.zip
      - name: Build original test APKs
        run: >-
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --no-build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Prepare isolated test APKs
        run: |
          mkdir -p "$RUNNER_TEMP/native-test"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          align="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          sha256sum app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/native-test/original-apk-sha256.txt"
          python3 scripts/native/prepare-emulator-apk.py \
            --input app/build/outputs/apk/debug/app-debug.apk \
            --abi '${{ matrix.abi }}' --engine-dir "$RUNNER_TEMP/native-engine-tested" --output "$RUNNER_TEMP/native-test/app-engine.apk" \
            --keystore "$HOME/.android/debug.keystore" --zipalign "$align" --apksigner "$signer"
          python3 tools/prepare-ui-test-apk.py \
            --input app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --output "$RUNNER_TEMP/native-test/test-engine.apk" \
            --keystore "$HOME/.android/debug.keystore" --zipalign "$align" --apksigner "$signer"
          sha256sum -c "$RUNNER_TEMP/native-test/original-apk-sha256.txt"
          app_cert=$("$signer" verify --print-certs "$RUNNER_TEMP/native-test/app-engine.apk" | grep 'Signer #1 certificate SHA-256 digest:')
          test_cert=$("$signer" verify --print-certs "$RUNNER_TEMP/native-test/test-engine.apk" | grep 'Signer #1 certificate SHA-256 digest:')
          test -n "$app_cert" && test "$app_cert" = "$test_cert"
      - name: Build standalone experimental preset app and tests
        run: >-
          ./gradlew assembleExperimental assembleExperimentalAndroidTest --no-daemon --no-build-cache --max-workers=2
          -PpresetInstrumentation=true -PfullPresetEngineDir="$RUNNER_TEMP/native-engine-tested" -PfullPresetAbi=${{ matrix.abi }}
          -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
      - name: Verify standalone native packaging
        run: python3 scripts/native/verify_engine_binary.py --abi '${{ matrix.abi }}' --apk app/build/outputs/apk/experimental/app-experimental.apk
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-presets-app-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/experimental/*.apk
            app/src/androidTest/assets/full-presets-actual.zip
      - name: Enable KVM on the ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release compiler memory before the emulator
        run: |
          jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}' | xargs -r kill
          mkdir -p native-slice-report
          free -m > native-slice-report/host-memory-before.txt
      - name: Test and start the isolated U1 simulator
        run: |
          python3 -m unittest discover -s tools/simulator -v
          python3 tools/simulator/u1_simulator.py --host 0.0.0.0 --allow-remote > "$RUNNER_TEMP/u1-simulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/u1-simulator.pid"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18725/__sim/info; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/u1-simulator.log"
          exit 1
      - name: Exercise STL and dual-color 3MF slicing and capture cube output
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            python3 scripts/native/run-native-instrumentation.py --suite core --app "$RUNNER_TEMP/native-test/app-engine.apk" --test "$RUNNER_TEMP/native-test/test-engine.apk" --log native-slice-report/instrumentation.log --timeout 900
            python3 scripts/native/export-parity-capture.py --output native-slice-report/cube
            python3 tools/parity/parity.py inspect native-slice-report/cube/cube_10mm.android.gcode > native-slice-report/cube/metrics.json
            cp "$RUNNER_TEMP/native-engine-tested/sha256.txt" native-slice-report/engine-sha256.txt
            cp "$RUNNER_TEMP/native-test/original-apk-sha256.txt" native-slice-report/
            adb shell dumpsys package io.github.jwischka.threedprintthethings > native-slice-report/package-abi.txt
            grep -F 'primaryCpuAbi=${{ matrix.abi }}' native-slice-report/package-abi.txt
            adb shell getprop ro.dalvik.vm.native.bridge > native-slice-report/native-bridge.txt
            adb shell am force-stop io.github.jwischka.threedprintthethings
            python3 scripts/native/run-native-instrumentation.py --suite geometry --app "$RUNNER_TEMP/native-test/app-engine.apk" --test "$RUNNER_TEMP/native-test/test-engine.apk" --log native-slice-report/geometry-instrumentation.log --timeout 600
            adb shell am force-stop io.github.jwischka.threedprintthethings
            python3 scripts/native/run-native-instrumentation.py --suite ui --app "$RUNNER_TEMP/native-test/app-engine.apk" --test "$RUNNER_TEMP/native-test/test-engine.apk" --log native-slice-report/main-ui-instrumentation.log --timeout 600
            mkdir -p native-slice-report/screenshots
            for name in library prepare preview upload; do adb exec-out run-as io.github.jwischka.threedprintthethings cat "files/workflow-capture/$name.png" > "native-slice-report/screenshots/$name.png" || exit 1; done
            sha256sum native-slice-report/screenshots/*.png > native-slice-report/screenshots/sha256.txt
            adb shell am force-stop io.github.jwischka.threedprintthethings
            python3 scripts/native/run-native-instrumentation.py --suite presets --app "$RUNNER_TEMP/native-test/app-engine.apk" --test "$RUNNER_TEMP/native-test/test-engine.apk" --log native-slice-report/preset-instrumentation.log --timeout 900
            python3 scripts/native/export-full-preset-capture.py --bundle app/src/androidTest/assets/full-presets --engine-pin "$(cat app/src/androidTest/assets/full-presets/engine-source.txt)" --output native-slice-report/presets
            adb shell am force-stop io.github.jwischka.threedprintthethings
            python3 scripts/native/run-native-instrumentation.py --suite preset-ui --app app/build/outputs/apk/experimental/app-experimental.apk --test app/build/outputs/apk/androidTest/experimental/app-experimental-androidTest.apk --log native-slice-report/preset-ui-instrumentation.log --timeout 900
            adb shell dumpsys package io.github.jwischka.threedprintthethings.presets > native-slice-report/preset-ui-package-abi.txt
            grep -F 'primaryCpuAbi=${{ matrix.abi }}' native-slice-report/preset-ui-package-abi.txt
            for name in selection result; do adb exec-out run-as io.github.jwischka.threedprintthethings.presets cat "files/preset-workflow-capture/$name.png" > "native-slice-report/screenshots/presets-$name.png" || exit 1; done
      - name: Stop simulator and retain diagnostics
        if: always()
        run: |
          mkdir -p native-slice-report
          if [ -f "$RUNNER_TEMP/u1-simulator.log" ]; then cp "$RUNNER_TEMP/u1-simulator.log" native-slice-report/; fi
          if [ -f "$RUNNER_TEMP/u1-simulator.pid" ]; then kill "$(cat "$RUNNER_TEMP/u1-simulator.pid")" || true; fi
          free -m > native-slice-report/host-memory-after.txt
          ps -eo pid,comm,rss --sort=-rss | sed -n '1,25p' > native-slice-report/host-process-memory.txt
          sudo dmesg -T | tail -150 > native-slice-report/host-kernel-tail.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-native-${{ matrix.abi }}-slice-smoke-log-attempt-${{ github.run_attempt }}
          path: native-slice-report/
          if-no-files-found: warn

  page-size-smoke:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: experimental-native-engine-x86_64
          path: ${{ runner.temp }}/native-engine-tested
      - name: Prepare preset workflow fixtures
        run: |
          set -euo pipefail
          mkdir -p app/src/androidTest/assets
          cp tools/parity/fixtures/cube_10mm.stl app/src/androidTest/assets/cube_10mm.stl
          pin=$(git ls-tree HEAD app/src/main/cpp/orcaslicer | awk '{print $3}')
          source="$RUNNER_TEMP/preset-source"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/taylormadearmy/OrcaSlicer.git
          git -C "$source" sparse-checkout init --cone
          git -C "$source" sparse-checkout set resources/profiles/Snapmaker
          git -C "$source" fetch --depth=1 --filter=blob:none origin "$pin"
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = "$pin"
          python3 tools/parity/prepare_presets.py --source "$source" --output app/src/androidTest/assets/full-presets
          for name in actual diagnostic; do
            python3 tools/parity/package_presets.py --bundle app/src/androidTest/assets/full-presets --manifest "$name.json" --output "app/src/androidTest/assets/full-presets-$name.zip"
          done
      - name: Build and verify standalone preset app
        run: |
          ./gradlew assembleExperimental assembleExperimentalAndroidTest --no-daemon --no-build-cache --max-workers=2 -PpresetInstrumentation=true -PfullPresetEngineDir="$RUNNER_TEMP/native-engine-tested" -PfullPresetAbi=x86_64 -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g
          python3 scripts/native/verify_engine_binary.py --abi x86_64 --apk app/build/outputs/apk/experimental/app-experimental.apk
      - name: Prepare emulator host
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          jps -l | awk '$2 == "org.jetbrains.kotlin.daemon.KotlinCompileDaemon" {print $1}' | xargs -r kill
          mkdir -p page-size-report
      - name: Slice and export on 16 KiB pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          emulator-options: -no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell getconf PAGE_SIZE > page-size-report/page-size.txt
            test "$(tr -d '\r\n' < page-size-report/page-size.txt)" = 16384
            python3 scripts/native/run-native-instrumentation.py --suite preset-ui --app app/build/outputs/apk/experimental/app-experimental.apk --test app/build/outputs/apk/androidTest/experimental/app-experimental-androidTest.apk --log page-size-report/instrumentation.log --timeout 900
            adb shell dumpsys package io.github.jwischka.threedprintthethings.presets > page-size-report/package-abi.txt
            grep -F 'primaryCpuAbi=x86_64' page-size-report/package-abi.txt
            for name in selection result; do adb exec-out run-as io.github.jwischka.threedprintthethings.presets cat "files/preset-workflow-capture/$name.png" > "page-size-report/$name.png" || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-native-16k-preset-ui-attempt-${{ github.run_attempt }}
          path: |
            page-size-report/
            app/build/outputs/apk/experimental/*.apk
          if-no-files-found: warn
