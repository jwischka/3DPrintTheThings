plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

// Local release credentials are optional; without them assembleRelease produces an unsigned APK.
def signingProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStore = System.getenv('RELEASE_STORE_FILE') ?: signingProperties.getProperty('release.storeFile')
def releaseStorePassword = System.getenv('RELEASE_STORE_PASSWORD') ?: signingProperties.getProperty('release.storePassword')
def releaseAlias = System.getenv('RELEASE_KEY_ALIAS') ?: signingProperties.getProperty('release.keyAlias')
def releaseKeyPassword = System.getenv('RELEASE_KEY_PASSWORD') ?: signingProperties.getProperty('release.keyPassword')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.u1.slicer'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.jwischka.threedprintthethings"
        minSdk 26
        targetSdk 34
        versionCode 401
        versionName "4.0.1"
        buildConfigField 'boolean', 'FULL_PRESET_EXPERIMENTAL', 'false'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        // Independently installed app: never package the inherited engine here.
        experimental {
            initWith debug
            applicationIdSuffix '.presets'
            matchingFallbacks = ['debug']
            buildConfigField 'boolean', 'FULL_PRESET_EXPERIMENTAL', 'true'
        }
    }

    testBuildType project.hasProperty('presetInstrumentation') ? 'experimental' : 'debug'
    sourceSets {
        main.jniLibs.srcDirs = []
        debug.jniLibs.srcDirs = ['src/main/jniLibs']
        release.jniLibs.srcDirs = ['src/main/jniLibs']
        experimental.jniLibs.srcDirs = [layout.buildDirectory.dir('fullPresetJni')]
    }

    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

//    externalNativeBuild {
//        cmake {
//            path "src/main/cpp/CMakeLists.txt"
//        }
//    }

}

// AGP 8.2 does not page-align uncompressed APK libraries for 16 KiB devices.
// Extract the single experimental JNI library; normal variants keep their packaging.
androidComponents {
    onVariants(selector().withBuildType('experimental')) { variant ->
        variant.packaging.jniLibs.useLegacyPackaging.set(true)
        variant.packaging.jniLibs.useLegacyPackagingFromBundle.set(true)
    }
}

// Require an explicit, checksummed native build output. A normal build does not
// consult this directory or change its shipped libraries.
def verifyFullPresetEngine = tasks.register('verifyFullPresetEngine') {
    def engineDirectory = providers.gradleProperty('fullPresetEngineDir')
    def engineAbi = providers.gradleProperty('fullPresetAbi').orElse('arm64-v8a')
    // No outputs: validate on every build, including when Sync has no sources.
    doLast {
        if (!engineDirectory.isPresent()) {
            throw new GradleException('Experimental builds require -PfullPresetEngineDir=<native build output>.')
        }
        def abi = engineAbi.get()
        def machines = ['arm64-v8a': 183, 'x86_64': 62]
        if (!machines.containsKey(abi)) throw new GradleException('Unsupported experimental engine ABI.')
        def engine = file(engineDirectory.get())
        def receipt = new File(engine, 'sha256.txt')
        if (!receipt.isFile()) throw new GradleException('Experimental engine sha256.txt is missing.')
        def capability = new File(engine, 'full-preset-schema.txt')
        if (!capability.isFile() || capability.text.trim() != 'orca-native-presets-v3') {
            throw new GradleException('Experimental builds require an engine built with v3 model filament mapping support.')
        }
        def runtime = new File(engine, 'cxx-runtime.txt')
        if (!runtime.isFile() || runtime.text.trim() != 'c++_static' || new File(engine, 'libc++_shared.so').exists()) {
            throw new GradleException('Experimental builds require a statically linked C++ runtime and no shared C++ library.')
        }
        ['libprusaslicer-jni.so', 'full-preset-schema.txt', 'cxx-runtime.txt'].each { name ->
            def library = new File(engine, name)
            if (!library.isFile()) throw new GradleException("Experimental engine is missing ${name}.")
            if (name.endsWith('.so')) {
                byte[] header = new byte[20]
                library.withInputStream { stream ->
                    if (stream.read(header) != 20) throw new GradleException('Truncated experimental engine.')
                }
                if ((header[0] & 255) != 127 || header[1] != 69 || header[2] != 76 || header[3] != 70 ||
                    header[4] != 2 || header[5] != 1 || ((header[18] & 255) | ((header[19] & 255) << 8)) != machines[abi]) {
                    throw new GradleException('Experimental engine ELF architecture does not match fullPresetAbi.')
                }
            }
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            library.withInputStream { stream ->
                byte[] buffer = new byte[65536]
                int size
                while ((size = stream.read(buffer)) != -1) digest.update(buffer, 0, size)
            }
            def expected = receipt.readLines().findAll { line ->
                def parts = line.trim().split(/\s+/, 2)
                parts.size() == 2 && parts[0] ==~ /[0-9a-f]{64}/ &&
                    parts[1].replace('\\', '/').replaceFirst(/^\*/, '').tokenize('/').last() == name
            }
            if (expected.size() != 1 || expected[0].take(64) != digest.digest().encodeHex().toString()) {
                throw new GradleException("Experimental engine checksum mismatch for ${name}.")
            }
        }
    }
}
def prepareFullPresetEngine = tasks.register('prepareFullPresetEngine', Sync) {
    dependsOn verifyFullPresetEngine
    into layout.buildDirectory.dir('fullPresetJni')
    from(providers.gradleProperty('fullPresetEngineDir').orElse('__missing_experimental_engine__')) {
        include 'libprusaslicer-jni.so'
        into providers.gradleProperty('fullPresetAbi').orElse('arm64-v8a')
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeExperimentalJniLibFolders') task.dependsOn prepareFullPresetEngine
}

dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    // DataStore (settings persistence)
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // Pin material3 to 1.2.1: navigation-compose:2.7.6 constrains it to 1.1.2 which was
    // compiled against the old keyframes.at(Object,Int) API, crashing on Compose 1.6.0 runtime.
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'

    // HTTP Client (Moonraker API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // H2D/X1-family cameras use authenticated RTSP rather than the JPEG
    // chamber-image protocol used by A1/P1. Keep the RTSP module isolated so
    // the existing bitmap camera path remains unchanged.
    implementation 'androidx.media3:media3-exoplayer:1.4.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.0'
    implementation 'androidx.media3:media3-ui:1.4.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    // Room (filament library + job history)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testing - Unit tests (JVM)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // org.json standalone JVM jar — needed for unit tests that exercise JSON parsing code
    testImplementation 'org.json:json:20231013'
    // kotlin-reflect — needed for the F86 reflective bucketing test
    testImplementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.22'

    // Testing - Instrumented tests (on-device)
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestUtil 'androidx.test:orchestrator:1.4.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    experimentalImplementation 'androidx.compose.ui:ui-tooling'
    experimentalImplementation 'androidx.compose.ui:ui-test-manifest'
}
